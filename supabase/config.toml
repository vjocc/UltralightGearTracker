# Minimal Supabase config (stub for local stack).
# Full local stack requires Docker (`npx supabase start`), which is not
# available in this environment. The migration + seed files in
# supabase/migrations and supabase/seed.sql apply cleanly to any Supabase
# project (local or hosted) when run via:
#     npx supabase db reset          # local
#     npx supabase db push           # hosted (linked project)

project_id = "ultralight-gear-tracker"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = false   # explicitly off per Architect design (no realtime MVP)

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083