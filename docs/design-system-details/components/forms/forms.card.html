<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/duotone/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/bold/style.css">
<style>
  body{padding:24px;background:var(--color-bg-page);font-family:var(--font-body);display:flex;flex-direction:column;gap:24px}
  .row{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
  .field{display:flex;flex-direction:column;gap:6;width:220px}
  label{font-size:14px;font-weight:600}
  .inputwrap{display:flex;align-items:center;height:48px;padding:0 16px;border-radius:var(--radius-sm);background:#fff;border:1.5px solid var(--color-border)}
  .inputwrap input, textarea{flex:1;border:none;outline:none;background:transparent;font-family:var(--font-body);font-size:16px;color:var(--color-text-primary);width:100%}
  .err{border-color:var(--color-danger)}
  .errtext{font-size:12px;color:var(--color-danger)}
  textarea{padding:12px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--color-border);background:#fff;resize:vertical}
  .selectbtn{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border-radius:var(--radius-sm);border:1.5px solid var(--color-border);background:#fff;font-family:var(--font-body);font-size:16px;cursor:pointer;width:220px}
  .menu{position:absolute;margin-top:4px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);overflow:hidden;width:220px;display:none}
  .menu div{padding:10px 16px;cursor:pointer}
  .menu div:hover{background:var(--surface-beige)}
  .chk,.radio,.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
  .box{width:20px;height:20px;border-radius:var(--radius-xs);border:1.5px solid var(--color-border);display:flex;align-items:center;justify-content:center}
  .box.on{background:var(--accent-purple);border-color:var(--accent-purple);color:#fff}
  .circle{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--color-border);display:flex;align-items:center;justify-content:center}
  .circle.on{border-color:var(--accent-purple)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-purple);display:none}
  .track{width:44px;height:26px;border-radius:var(--radius-full);background:var(--surface-beige);position:relative}
  .track.on{background:var(--accent-purple)}
  .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:left .15s}
  .track.on .knob{left:21px}
</style></head>
<body>
  <div class="row">
    <div class="field"><label>E-mail</label><div class="inputwrap"><input placeholder="nev@example.com"></div></div>
    <div class="field"><label>Jelszó</label><div class="inputwrap err"><input placeholder="••••••••" type="password"></div><span class="errtext">Legalább 8 karakter</span></div>
    <div class="field" style="position:relative"><label>Videó hossza</label><button class="selectbtn" onclick="const m=this.nextElementSibling;m.style.display=m.style.display==='block'?'none':'block'">1 perc <i class="ph-duotone ph-caret-down"></i></button>
      <div class="menu"><div onclick="this.closest('.field').querySelector('.selectbtn').firstChild.textContent=this.textContent+' '">1 perc</div><div>3 perc</div><div>5 perc</div></div>
    </div>
    <div class="field"><label>Megjegyzés</label><textarea rows="3" placeholder="Írj ide..."></textarea></div>
  </div>
  <div class="row">
    <label class="chk"><span class="box on" onclick="this.classList.toggle('on')"><i class="ph-bold ph-check" style="font-size:13px"></i></span>Elfogadom a feltételeket</label>
    <label class="chk"><span class="box" onclick="this.classList.toggle('on');this.innerHTML=this.classList.contains('on')?'<i class=\'ph-bold ph-check\' style=\'font-size:13px\'></i>':''">​</span>Hírlevél</label>
    <label class="radio"><span class="circle on" onclick="document.querySelectorAll('.circle').forEach(c=>c.classList.remove('on'));this.classList.add('on')"><span class="dot" style="display:block"></span></span>Havi</label>
    <label class="radio"><span class="circle" onclick="document.querySelectorAll('.circle').forEach(c=>{c.classList.remove('on');c.querySelector('.dot').style.display='none'});this.classList.add('on');this.querySelector('.dot').style.display='block'"><span class="dot"></span></span>Éves</label>
    <label class="switch"><span class="track on" onclick="this.classList.toggle('on')"><span class="knob"></span></span>Értesítések</label>
  </div>
</body></html>
