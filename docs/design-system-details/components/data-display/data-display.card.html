<!-- @dsCard group="Components" viewport="700x460" name="Cards, badges & status" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/bold/style.css">
<style>
  body{padding:24px;background:var(--color-bg-page);font-family:var(--font-body);display:flex;flex-direction:column;gap:32px}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .badge{display:inline-flex;padding:4px 12px;border-radius:var(--radius-full);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;width:fit-content}
  .card{padding:32px;border-radius:var(--radius-md);display:flex;flex-direction:column;gap:12px;width:220px}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--brand-900);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700}
  .bar{height:8px;border-radius:var(--radius-full);background:var(--surface-beige);width:260px}
  .bar > div{height:100%;border-radius:var(--radius-full);background:var(--accent-purple)}
  .stepper{display:flex;width:420px}
  .step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
  .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
  .connector{height:2px;flex:1;margin-top:16px}
</style></head>
<body>
  <div class="row">
    <div class="card" style="background:var(--surface-peach);color:var(--brand-900)"><span class="badge" style="background:color-mix(in oklab, var(--accent-purple) 15%, white);color:var(--accent-purple)">Túrázás</span><b style="font-family:var(--font-display);font-size:18px">Kártya címe</b><span>Rövid leíró szöveg a kártyához.</span></div>
    <div class="card" style="background:var(--brand-900);color:var(--surface-cream);box-shadow:var(--shadow-md)"><span class="badge" style="background:color-mix(in oklab, var(--accent-orange) 18%, white);color:var(--accent-orange)">Ünnepelj!</span><b style="font-family:var(--font-display);font-size:18px">Sötét kártya</b><span>7 napon belül küldjük a videót.</span></div>
    <div class="row"><div class="avatar">KB</div><div class="avatar" style="width:64px;height:64px;font-size:23px">MF</div></div>
  </div>
  <div class="row" style="gap:32px">
    <div><label style="font-size:14px;font-weight:600">Feltöltés</label><div class="bar"><div style="width:68%"></div></div></div>
    <div class="stepper">
      <div class="step"><div class="dot" style="background:var(--accent-purple);color:#fff"><i class="ph-bold ph-check"></i></div><span style="font-size:12px;font-weight:600">Rendeld meg</span></div>
      <div class="connector" style="background:var(--accent-purple)"></div>
      <div class="step"><div class="dot" style="background:var(--accent-purple);color:#fff">2</div><span style="font-size:12px;font-weight:600">Töltsd fel</span></div>
      <div class="connector" style="background:var(--surface-beige)"></div>
      <div class="step"><div class="dot" style="background:var(--surface-beige);color:var(--color-text-secondary)">3</div><span style="font-size:12px;font-weight:600;color:var(--color-text-secondary)">Ünnepelj</span></div>
    </div>
  </div>
</body></html>
