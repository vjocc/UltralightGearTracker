<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--color-bg-page);font-family:var(--font-body)}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:var(--radius-pill);font-family:var(--font-body);font-weight:700;white-space:nowrap;cursor:pointer}
  .lg{height:56px;padding:16px 36px;font-size:16px}
  .md{height:48px;padding:12px 36px;font-size:16px}
  .sm{height:40px;padding:8px 24px;font-size:14px}
  .primary{background:var(--accent-purple);color:var(--color-text-inverse)}
  .secondary{background:var(--accent-orange);color:var(--color-text-inverse)}
  .outline{background:transparent;color:var(--brand-900);box-shadow:var(--shadow-inset-border)}
  .ghost{background:transparent;color:var(--brand-900)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
</style></head>
<body>
  <div class="row">
    <button class="btn lg primary">Töltsd fel a videóid!</button>
    <button class="btn lg outline">Ismerd meg!</button>
    <button class="btn lg secondary">Megrendelem</button>
    <button class="btn lg ghost">Mégse</button>
  </div>
  <div class="row">
    <button class="btn md primary">Megrendelem</button>
    <button class="btn sm outline">Profil</button>
    <button class="btn md primary" disabled>Nem elérhető</button>
  </div>
</body></html>
