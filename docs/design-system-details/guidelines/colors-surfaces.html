<!-- @dsCard group="Colors" viewport="700x260" subtitle="Section backgrounds — warm neutrals" name="Surfaces" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-body);background:var(--color-bg-page)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{height:70px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:8px;font-size:10.5px;font-weight:600;color:var(--brand-900);border:1px solid var(--color-border)}
</style>
<div class="grid">
  <div class="sw" style="background:var(--surface-white)">white</div>
  <div class="sw" style="background:var(--surface-cream)">cream</div>
  <div class="sw" style="background:var(--surface-peach)">peach</div>
  <div class="sw" style="background:var(--surface-peach-light)">peach-light</div>
  <div class="sw" style="background:var(--surface-off-white)">off-white</div>
  <div class="sw" style="background:var(--surface-beige)">beige</div>
  <div class="sw" style="background:var(--surface-cool)">cool</div>
  <div class="sw" style="background:var(--surface-blue-pale)">blue-pale</div>
</div>
